name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint, and build release APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew test lint assembleRelease

      - name: Name release APK
        id: release_apk
        shell: bash
        run: |
          version_name="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          if [ -z "$version_name" ]; then
            echo "VERSION_NAME is missing from gradle.properties"
            exit 1
          fi
          apk_name="shush-tv-v${version_name}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${apk_name}"
          echo "apk_name=${apk_name}" >> "$GITHUB_OUTPUT"
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: shush-tv-release-v${{ steps.release_apk.outputs.version_name }}
          path: dist/${{ steps.release_apk.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 14
